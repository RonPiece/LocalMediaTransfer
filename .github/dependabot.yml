version: 2

updates:
  - package-ecosystem: npm
    directory: /src/LocalMediaTransfer.iOS
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-compatible-updates:
        update-types:
          - minor
          - patch

  - package-ecosystem: nuget
    directory: /src/LocalMediaTransfer.GUI
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      nuget-compatible-updates:
        update-types:
          - minor
          - patch

  - package-ecosystem: vcpkg
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions-compatible-updates:
        update-types:
          - minor
          - patch
