name: Android compiler and manifest

on:
  push:
    branches: ['codex/**']
    paths:
      - 'src/LocalMediaTransfer.Mobile/**'
      - '.github/workflows/android-compile.yml'
  pull_request:
    paths:
      - 'src/LocalMediaTransfer.Mobile/**'
      - '.github/workflows/android-compile.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/LocalMediaTransfer.Mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/LocalMediaTransfer.Mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_LMT_ENVIRONMENT: test
      - run: ./gradlew :local-media-transfer-native:testDebugUnitTest :local-media-transfer-native:assembleDebugAndroidTest :app:assembleDebug :app:processReleaseMainManifest -PreactNativeArchitectures=x86_64 --stacktrace
        working-directory: src/LocalMediaTransfer.Mobile/android
        env:
          EXPO_PUBLIC_LMT_ENVIRONMENT: test
      - name: Check TEST package identity
        run: grep -q "applicationId 'com.ronthedev.localmediatransfer.test'" android/app/build.gradle
      - name: Check merged manifest permissions
        run: |
          debug_manifest=$(find android/app/build/intermediates/merged_manifests/debug -name AndroidManifest.xml | head -n 1)
          release_manifest=$(find android/app/build/intermediates/merged_manifest/release -name AndroidManifest.xml | head -n 1)
          test -s "$debug_manifest"
          test -s "$release_manifest"
          for manifest in "$debug_manifest" "$release_manifest"; do
            if grep -E 'READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_(IMAGES|VIDEO|AUDIO|VISUAL_USER_SELECTED)|ACCESS_MEDIA_LOCATION|RECORD_AUDIO|requestLegacyExternalStorage' "$manifest"; then
              echo 'Disallowed media or audio permission found in merged manifest' >&2
              exit 1
            fi
          done
          if grep -q 'SYSTEM_ALERT_WINDOW' "$release_manifest"; then
            echo 'Overlay permission found in release manifest' >&2
            exit 1
          fi
