name: Build unsigned iOS IPA

on:
  pull_request:
  workflow_call:
    inputs:
      environment:
        type: string
        default: production
      build_profile:
        type: string
        default: release
  workflow_dispatch:
    inputs:
      environment:
        description: iOS application environment
        required: true
        default: production
        type: choice
        options:
          - test
          - production
      build_profile:
        description: iOS IPA build profile
        required: true
        default: release
        type: choice
        options:
          - release
          - development

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_LMT_ENVIRONMENT: ${{ (inputs.build_profile == 'development' && 'test') || inputs.environment || 'production' }}
      LMT_IOS_BUILD_PROFILE: ${{ inputs.build_profile || 'release' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/LocalMediaTransfer.iOS/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: src/LocalMediaTransfer.iOS
        run: npm ci

      - name: Record native toolchain and validate environment
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPO_PUBLIC_LMT_ENVIRONMENT" == production || "$EXPO_PUBLIC_LMT_ENVIRONMENT" == test ]]
          [[ "$LMT_IOS_BUILD_PROFILE" == release || "$LMT_IOS_BUILD_PROFILE" == development ]]
          if [[ "$LMT_IOS_BUILD_PROFILE" == development ]]; then
            [[ "$EXPO_PUBLIC_LMT_ENVIRONMENT" == test ]]
          fi
          mkdir -p native-build-evidence
          git rev-parse HEAD > native-build-evidence/commit.txt
          xcodebuild -version > native-build-evidence/xcode.txt
          swift --version > native-build-evidence/swift.txt
          node --version > native-build-evidence/node.txt
          pod --version > native-build-evidence/cocoapods.txt

      - name: Run Jest tests
        working-directory: src/LocalMediaTransfer.iOS
        run: npm test -- --runInBand

      - name: Check TypeScript
        working-directory: src/LocalMediaTransfer.iOS
        run: npx tsc --noEmit

      - name: Run ESLint
        working-directory: src/LocalMediaTransfer.iOS
        run: npm run lint

      - name: Generate native iOS project
        working-directory: src/LocalMediaTransfer.iOS
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        working-directory: src/LocalMediaTransfer.iOS/ios
        run: |
          pod install --repo-update
          grep -q "LocalMediaTransferNative" Podfile.lock
          grep -q "ExpoFont" Podfile.lock
          modules_provider="$(find Pods -name 'ExpoModulesProvider.swift' -print -quit)"
          if [[ -z "$modules_provider" ]] || ! grep -q "LocalMediaTransferNativeModule" "$modules_provider"; then
            echo "Expo module provider is missing LocalMediaTransferNativeModule" >&2
            exit 1
          fi
          if [[ "$LMT_IOS_BUILD_PROFILE" == development ]]; then
            grep -q "expo-dev-client" Podfile.lock
            grep -q "expo-dev-launcher" Podfile.lock
          fi
          cp Podfile.lock ../../../native-build-evidence/Podfile.lock

      - name: Build unsigned device application
        working-directory: src/LocalMediaTransfer.iOS
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [[ -z "$workspace" ]]; then
            echo "No generated Xcode workspace found" >&2
            exit 1
          fi
          # Expo names the application workspace and shared application scheme
          # identically. Do not select the first listed scheme: CocoaPods
          # schemes such as EXConstants may appear first and build successfully
          # without producing the application bundle.
          scheme="$(basename "$workspace" .xcworkspace)"
          if [[ -z "$scheme" ]]; then
            echo "No Xcode scheme found" >&2
            exit 1
          fi
          configuration="Release"
          if [[ "$LMT_IOS_BUILD_PROFILE" == development ]]; then
            configuration="Debug"
          fi
          echo "Building application scheme: $scheme ($configuration)"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration "$configuration" \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA for Sideloadly
        working-directory: src/LocalMediaTransfer.iOS
        shell: bash
        run: |
          set -euo pipefail
          products_directory="Release-iphoneos"
          if [[ "$LMT_IOS_BUILD_PROFILE" == development ]]; then
            products_directory="Debug-iphoneos"
          fi
          app="$(find "build/Build/Products/$products_directory" -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$app" ]]; then
            echo "Unsigned application bundle was not produced" >&2
            exit 1
          fi
          if [[ "$LMT_IOS_BUILD_PROFILE" == release ]]; then
            if [[ ! -f "$app/main.jsbundle" ]]; then
              echo "Release application bundle is missing main.jsbundle" >&2
              find "$app" -maxdepth 2 -type f -print
              exit 1
            fi
          elif [[ -z "$(find "$app" -maxdepth 2 -name 'EXDevLauncher.bundle' -print -quit)" ]]; then
            echo "Debug application is missing the Expo development-client launcher" >&2
            exit 1
          fi
          echo "Packaging application: $app"
          if [[ "$LMT_IOS_BUILD_PROFILE" == release ]]; then
            echo "Embedded JavaScript bundle: $(du -h "$app/main.jsbundle" | cut -f1)"
          else
            echo "Development client will load JavaScript from Metro"
          fi
          expected_bundle_id="com.ronthedev.localmediatransfer"
          expected_display_name="Local Media Transfer"
          artifact_basename="LocalMediaTransfer-production-unsigned"
          if [[ "$LMT_IOS_BUILD_PROFILE" == "development" ]]; then
            expected_bundle_id="com.ronthedev.localmediatransfer.test"
            expected_display_name="Local Media Transfer TEST"
            artifact_basename="LocalMediaTransfer-test-development-unsigned"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' "$app/Info.plist" | grep -q "exp+ronthedev-local-media-transfer-iphone-2026-test"
          elif [[ "$EXPO_PUBLIC_LMT_ENVIRONMENT" == "test" ]]; then
            expected_bundle_id="com.ronthedev.localmediatransfer.test"
            expected_display_name="Local Media Transfer TEST"
            artifact_basename="LocalMediaTransfer-test-unsigned"
          fi
          actual_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          actual_display_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist")"
          [[ "$actual_bundle_id" == "$expected_bundle_id" ]]
          [[ "$actual_display_name" == "$expected_display_name" ]]
          rm -rf Payload LocalMediaTransfer-*-unsigned.ipa
          mkdir Payload
          cp -R "$app" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload "${artifact_basename}.ipa"
          echo "LMT_IPA_ARTIFACT_BASENAME=$artifact_basename" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ env.LMT_IPA_ARTIFACT_BASENAME }}-ipa
          path: |
            src/LocalMediaTransfer.iOS/${{ env.LMT_IPA_ARTIFACT_BASENAME }}.ipa
            native-build-evidence/**
          if-no-files-found: error
          retention-days: 14
